{% if topics %}
<div class="section">
    <h2 class="section-title">Chủ đề nổi bật</h2>
    <div class="topics-grid">
        {% for topic in topics %}
        <div class="topic-item">
            <div class="topic-header">
                <span class="topic-number">{{ topic.index }}</span>
                <span class="topic-title">{{ topic.topic.topic }}</span>
            </div>
            <div class="topic-contributors">Người tham gia: {{ topic.contributors }}</div>
            <div class="topic-detail">{{ topic.detail | safe }}</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
